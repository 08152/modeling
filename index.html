
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Blender 3D</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #202124;
    color: white;
    overflow: hidden;
}

#app {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* OBERE LEISTE */

#topbar {
    height: 48px;
    background: #303236;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 15px;
    border-bottom: 1px solid #111;
}

.logo {
    font-size: 19px;
    font-weight: bold;
    color: #ff9b38;
}

.top-button {
    background: #414449;
    color: white;
    border: 1px solid #555;
    padding: 7px 12px;
    border-radius: 4px;
    cursor: pointer;
}

.top-button:hover {
    background: #60646a;
}

/* HAUPTBEREICH */

#main {
    flex: 1;
    display: flex;
    min-height: 0;
}

/* LINKES MENÜ */

#left {
    width: 210px;
    background: #292b2f;
    border-right: 1px solid #111;
    padding: 12px;
    overflow-y: auto;
}

.panel-title {
    font-size: 13px;
    font-weight: bold;
    color: #aaa;
    margin: 12px 0 8px;
    text-transform: uppercase;
}

.tool-button {
    width: 100%;
    background: #3b3e43;
    color: white;
    border: 1px solid #50545a;
    padding: 10px;
    margin-bottom: 6px;
    border-radius: 4px;
    cursor: pointer;
    text-align: left;
}

.tool-button:hover {
    background: #555a61;
}

.tool-button.active {
    background: #bd702b;
}

#objectList {
    margin-top: 8px;
}

.object-item {
    padding: 9px;
    margin-bottom: 4px;
    background: #373a3f;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
}

.object-item:hover {
    background: #50545a;
}

.object-item.selected {
    background: #87501f;
}

/* 3D VIEWPORT */

#viewport {
    flex: 1;
    min-width: 0;
    min-height: 0;
    position: relative;
    overflow: hidden;
    background: #34383e;
}

#viewport canvas {
    display: block;
    width: 100%;
    height: 100%;
    outline: none;
}

/* RECHTES MENÜ */

#right {
    width: 245px;
    background: #292b2f;
    border-left: 1px solid #111;
    padding: 12px;
    overflow-y: auto;
}

label {
    display: block;
    color: #bbb;
    font-size: 12px;
    margin: 10px 0 4px;
}

input, select {
    width: 100%;
    padding: 8px;
    background: #191a1d;
    color: white;
    border: 1px solid #555;
    border-radius: 4px;
}

input[type="color"] {
    height: 38px;
    padding: 3px;
}

input[type="range"] {
    padding: 0;
}

hr {
    border: 0;
    border-top: 1px solid #444;
    margin: 15px 0;
}

/* UNTERE LEISTE */

#footer {
    height: 30px;
    background: #303236;
    border-top: 1px solid #111;
    display: flex;
    align-items: center;
    padding: 0 12px;
    color: #aaa;
    font-size: 12px;
    justify-content: space-between;
}

#message {
    color: #ffbd77;
}

</style>
</head>

<body>

<div id="app">

    <header id="topbar">
        <div class="logo">MINI BLENDER</div>

        <button class="top-button" onclick="addCube()">Würfel</button>
        <button class="top-button" onclick="addSphere()">Kugel</button>
        <button class="top-button" onclick="addCylinder()">Zylinder</button>

        <button class="top-button" onclick="exportGLB()">GLB Export</button>
    </header>

    <main id="main">

        <!-- LINKES MENÜ -->

        <aside id="left">

            <div class="panel-title">Erstellen</div>

            <button class="tool-button" onclick="addCube()">＋ Würfel</button>
            <button class="tool-button" onclick="addSphere()">＋ Kugel</button>
            <button class="tool-button" onclick="addCylinder()">＋ Zylinder</button>
            <button class="tool-button" onclick="addPlane()">＋ Fläche</button>

            <hr>

            <div class="panel-title">Werkzeuge</div>

            <button class="tool-button active" id="objectModeButton"
                onclick="setObjectMode()">Objekt-Modus</button>

            <button class="tool-button" id="sculptModeButton"
                onclick="setSculptMode()">Modellieren</button>

            <button class="tool-button" id="paintModeButton"
                onclick="setPaintMode()">Malen</button>

            <button class="tool-button" onclick="focusSelectedObject()">
                Ansicht auf Objekt
            </button>

            <hr>

            <div class="panel-title">Objekte</div>
            <div id="objectList"></div>

        </aside>

        <!-- 3D BEREICH -->

        <section id="viewport"></section>

        <!-- RECHTES MENÜ -->

        <aside id="right">

            <div class="panel-title">Objekteigenschaften</div>

            <label>Name</label>
            <input id="objectName" type="text" placeholder="Objektname"
                onchange="renameSelected(this.value)">

            <hr>

            <div class="panel-title">Position</div>

            <label>X</label>
            <input id="posX" type="number" step="0.1" value="0"
                onchange="updateTransform()">

            <label>Y</label>
            <input id="posY" type="number" step="0.1" value="0"
                onchange="updateTransform()">

            <label>Z</label>
            <input id="posZ" type="number" step="0.1" value="0"
                onchange="updateTransform()">

            <hr>

            <div class="panel-title">Rotation</div>

            <label>X</label>
            <input id="rotX" type="number" step="1" value="0"
                onchange="updateTransform()">

            <label>Y</label>
            <input id="rotY" type="number" step="1" value="0"
                onchange="updateTransform()">

            <label>Z</label>
            <input id="rotZ" type="number" step="1" value="0"
                onchange="updateTransform()">

            <hr>

            <div class="panel-title">Größe</div>

            <label>X</label>
            <input id="scaleX" type="number" step="0.1" value="1"
                onchange="updateTransform()">

            <label>Y</label>
            <input id="scaleY" type="number" step="0.1" value="1"
                onchange="updateTransform()">

            <label>Z</label>
            <input id="scaleZ" type="number" step="0.1" value="1"
                onchange="updateTransform()">

            <hr>

            <div class="panel-title">Farbe</div>

            <input id="objectColor" type="color" value="#ff9900"
                onchange="changeObjectColor(this.value)">

            <button class="tool-button" onclick="deleteSelected()">
                Objekt löschen
            </button>

            <button class="tool-button" onclick="duplicateSelected()">
                Objekt duplizieren
            </button>

        </aside>

    </main>

    <footer id="footer">
        <span>Mini Blender 3D</span>
        <span id="message">Wird geladen ...</span>
    </footer>

</div>

<!-- THREE.JS UND ERWEITERUNGEN -->

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/examples/js/exporters/GLTFExporter.js"></script>

<!-- EIGENE DATEIEN -->

<script src="modelieren.js"></script>
<script src="malen.js"></script>
<script src="farbe.js"></script>
<script src="export.js"></script>
<script src="3-D.js"></script>
<script src="verbindung.js"></script>

<script>

/* =====================================
   START
===================================== */

window.addEventListener("load", function() {

    try {

        if (!window.THREE) {
            throw new Error("Three.js konnte nicht geladen werden.");
        }

        if (!THREE.OrbitControls) {
            throw new Error("OrbitControls konnte nicht geladen werden.");
        }

        if (typeof start3D !== "function") {
            throw new Error("3-D.js wurde nicht richtig geladen.");
        }

        start3D();

        if (typeof connectMiniBlender === "function") {
            connectMiniBlender();
        }

        updateObjectList();

        document.getElementById("message").textContent =
            "3D-Editor bereit";

    } catch(error) {

        document.getElementById("message").textContent =
            "Fehler: " + error.message;

        console.error(error);

    }

});


/* =====================================
   OBJEKTLISTE
===================================== */

function updateObjectList() {

    const list = document.getElementById("objectList");

    if (!window.scene) return;

    list.innerHTML = "";

    scene.children.forEach(function(object) {

        if (!object.userData.isModelObject) return;

        const item = document.createElement("div");

        item.className = "object-item";

        if (window.selectedObject === object) {
            item.classList.add("selected");
        }

        item.textContent = object.name || "Objekt";

        item.onclick = function() {

            if (window.viewportEngine) {
                viewportEngine.selectObject(object);
            }

            updateObjectList();
            updateProperties(object);

        };

        list.appendChild(item);

    });

}


/* =====================================
   EIGENSCHAFTEN
===================================== */

function updateProperties(object) {

    if (!object) return;

    document.getElementById("objectName").value =
        object.name || "";

    document.getElementById("posX").value =
        object.position.x.toFixed(2);

    document.getElementById("posY").value =
        object.position.y.toFixed(2);

    document.getElementById("posZ").value =
        object.position.z.toFixed(2);

    document.getElementById("rotX").value =
        THREE.MathUtils.radToDeg(object.rotation.x).toFixed(1);

    document.getElementById("rotY").value =
        THREE.MathUtils.radToDeg(object.rotation.y).toFixed(1);

    document.getElementById("rotZ").value =
        THREE.MathUtils.radToDeg(object.rotation.z).toFixed(1);

    document.getElementById("scaleX").value =
        object.scale.x.toFixed(2);

    document.getElementById("scaleY").value =
        object.scale.y.toFixed(2);

    document.getElementById("scaleZ").value =
        object.scale.z.toFixed(2);

}


/* =====================================
   TRANSFORMIEREN
===================================== */

function updateTransform() {

    const object = window.selectedObject;

    if (!object) return;

    const value = id =>
        parseFloat(document.getElementById(id).value) || 0;

    object.position.set(
        value("posX"),
        value("posY"),
        value("posZ")
    );

    object.rotation.set(
        THREE.MathUtils.degToRad(value("rotX")),
        THREE.MathUtils.degToRad(value("rotY")),
        THREE.MathUtils.degToRad(value("rotZ"))
    );

    object.scale.set(
        Math.max(0.001, value("scaleX")),
        Math.max(0.001, value("scaleY")),
        Math.max(0.001, value("scaleZ"))
    );

}


/* =====================================
   FARBE
===================================== */

function changeObjectColor(color) {

    const object = window.selectedObject;

    if (!object || !object.material) return;

    const materials = Array.isArray(object.material)
        ? object.material
        : [object.material];

    materials.forEach(function(material) {

        if (material.color) {
            material.color.set(color);
        }

    });

}


/* =====================================
   OBJEKTNAME
===================================== */

function renameSelected(name) {

    const object = window.selectedObject;

    if (!object) return;

    object.name = name || "Objekt";

    updateObjectList();

}


/* =====================================
   OBJEKTE
===================================== */

function addCube() {

    if (!window.modelTools) return;

    const object = modelTools.addCube();

    if (object) {
        updateObjectList();
        updateProperties(object);
    }

}

function addSphere() {

    if (!window.modelTools) return;

    const object = modelTools.addSphere();

    if (object) {
        updateObjectList();
        updateProperties(object);
    }

}

function addCylinder() {

    if (!window.modelTools) return;

    const object = modelTools.addCylinder();

    if (object) {
        updateObjectList();
        updateProperties(object);
    }

}

function addPlane() {

    if (!window.modelTools) return;

    const object = modelTools.addPlane();

    if (object) {
        updateObjectList();
        updateProperties(object);
    }

}


/* =====================================
   LÖSCHEN / DUPLIZIEREN
===================================== */

function deleteSelected() {

    if (!window.selectedObject) return;

    if (window.modelTools) {
        modelTools.deleteSelected();
    } else {
        scene.remove(window.selectedObject);
    }

    window.selectedObject = null;

    updateObjectList();

}

function duplicateSelected() {

    const object = window.selectedObject;

    if (!object || !window.modelTools) return;

    if (modelTools.duplicateSelected) {
        modelTools.duplicateSelected();
    }

    updateObjectList();

}


/* =====================================
   MODI
===================================== */

function setObjectMode() {

    if (window.viewportEngine) {
        viewportEngine.setObjectMode();
    }

    setActiveButton("objectModeButton");

}

function setSculptMode() {

    if (window.viewportEngine) {
        viewportEngine.setSculptMode();
    }

    setActiveButton("sculptModeButton");

}

function setPaintMode() {

    if (window.viewportEngine) {
        viewportEngine.setPaintMode();
    }

    setActiveButton("paintModeButton");

}

function setActiveButton(id) {

    document.querySelectorAll(".tool-button").forEach(button => {
        button.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");

}


/* =====================================
   ANSICHT
===================================== */

function focusSelectedObject() {

    if (window.viewportEngine) {
        viewportEngine.focusSelected();
    }

}


/* =====================================
   AUSWAHL AKTUALISIEREN
===================================== */

window.updateObjectList = updateObjectList;
window.updateProperties = updateProperties;

</script>

</body>
</html>
